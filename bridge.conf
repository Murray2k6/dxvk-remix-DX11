# Bridge settings shipped with builds. Full option reference:
# bridge_dx11_work/bridge.conf (commented template with all defaults).

# Per-command IPC logging. The DX11 capture bridge streams RemixApi_*
# commands for every draw every frame; logging each one multiplies the
# per-draw cost on the IPC hot path and grows the log without bound.
# Keep these False for playable builds - flip to True only while
# debugging a specific bridge issue.
logServerCommands = False
logAllCommands = False
