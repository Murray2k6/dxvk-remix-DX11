# Project-level Remix configuration for the DX11 fork. This file is shipped
# with release packages (package_release.ps1 copies it next to the runtime).
#
# Engine defaults are defined in source so the runtime behaves consistently
# without requiring this configuration overlay. Keep per-game overrides in a
# separate config file when needed.

# DX11 capture: force Remix injection even when the frame heuristics are
# uncertain. Pure-UI frames still pass through (DX11_V253 menu passthrough).
# NOTE: the option category is "rtx", not "rtx.dx11" - the old key
# rtx.dx11.forceInjection was never read by the runtime.
rtx.forceInjection = True

# Allow cubemap render targets/draws to be considered for ray tracing
# (source default is False).
rtx.allowCubemaps = True

# Keep vertex-color baked lighting contributing to materials (engines like
# Saints Row IV bake lighting into vertex colors). False is the source
# default; kept here for discoverability when a game needs it flipped.
rtx.ignoreAllVertexColorBakedLighting = False

# Do NOT cap scene instance submissions here. rtx.maxInstanceSubmissions
# defaults to 100000 (effectively uncapped); an earlier value of 512 silently
# dropped geometry in any scene with more than 512 instances.
