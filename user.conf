# User-level Remix preferences.
#
# These are startup defaults only. The Basic and Dev UI should be able to
# change these at runtime and save new values to this file.

# Overall preset: 0 Ultra, 1 High, 2 Medium, 3 Low, 4 Custom, 5 Auto.
rtx.graphicsPreset = 4

# Upscaler: 0 None, 1 DLSS, 2 NIS, 3 TAA-U, 4 XeSS.
# TAA-U is the vendor-neutral default. DLSS/XeSS remain selectable in UI.
rtx.upscalerType = 3

# Per-upscaler quality defaults.
# TAA-U/NIS: 0 UltraPerformance/Performance, 1 Performance/Balanced,
# 2 Balanced/Quality depending on the enum, 3 Quality/Fullscreen, 4 Fullscreen.
rtx.taauPreset = 2
rtx.nisPreset = 1

# DLSS preset: 0 Off, 1 On, 2 Custom.
# MUST stay 2 (Custom): preset 1 (On) force-switches rtx.upscalerType to DLSS
# in updateUpscalerFromDlssPreset, overriding the vendor-neutral TAA-U default
# above on every GPU. Custom is the no-op preset; DLSS stays selectable in UI.
rtx.dlssPreset = 2

# XeSS preset: 0 UltraPerf, 1 Performance, 2 Balanced, 3 Quality,
# 4 UltraQuality, 5 UltraQualityPlus, 6 NativeAA, 7 Custom.
rtx.xess.preset = 2

# Internal render scale used by temporal upscalers.
rtx.resolutionScale = 0.75

# Indirect lighting: 0 ImportanceSampled, 1 ReSTIR GI, 2 NeuralRadianceCache.
# MUST stay 1 (ReSTIR GI): NRC (2) crashes on first RT frame when not ready
# (TODO[REMIX-4105]; reproduced on RTX 4060/Minecraft) and only exists on
# NVIDIA. NRC is opt-in via env DXVK_REMIX_ENABLE_NRC=1 (see DX11_V244).
rtx.integrateIndirectMode = 1

# Path length. The engine allows up to 15 indirect bounces (default cap 4),
# but Russian Roulette terminates most paths after 1-2 bounces - that is the
# "2 bounces" widely reported for Remix. These settings deepen the GI:
# a 6-bounce ceiling and a higher first-bounce survival probability so paths
# actually reach the deeper bounces. For even fuller GI set
# rtx.pathMinBounces = 2 (guarantees 2 bounces per path, real perf cost).
# NRC (integrateIndirectMode = 2, NVIDIA only, opt-in above) gives effectively
# unlimited bounces by terminating paths into its trained radiance cache.
rtx.pathMaxBounces = 6
rtx.pathMinBounces = 1
rtx.russianRoulette1stBounceMinContinueProbability = 0.8

# Keep manufacturer denoiser support available where the GPU/runtime supports it.
rtx.enableRayReconstruction = True

# Replacement asset toggles.
rtx.enableReplacementAssets = True
rtx.enableReplacementLights = True
rtx.enableReplacementMeshes = True
rtx.enableReplacementMaterials = True

# UI preferences.
rtx.defaultToAdvancedUI = False
rtx.restoreCursorPosition = True
rtx.gui.textureGridThumbnailScale = 1.0

# VSync: 0 Off, 1 On, 2 wait for the game's implicit swapchain setting.
rtx.enableVsync = 2
