# User-level Remix preferences.
#
# These are startup defaults only. The Basic and Dev UI should be able to
# change these at runtime and save new values to this file.

# Overall preset: 0 Ultra, 1 High, 2 Medium, 3 Low, 4 Custom, 5 Auto.
rtx.graphicsPreset = 4

# Upscaler: 0 None, 1 DLSS, 2 NIS, 3 TAA-U, 4 XeSS, 5 FSR4.
# TAA-U is the vendor-neutral default. DLSS/XeSS/FSR4 remain selectable in UI.
rtx.upscalerType = 3

# Per-upscaler quality defaults.
# TAA-U/NIS: 0 UltraPerformance/Performance, 1 Performance/Balanced,
# 2 Balanced/Quality depending on the enum, 3 Quality/Fullscreen, 4 Fullscreen.
rtx.taauPreset = 2
rtx.nisPreset = 1

# DLSS preset: 0 Off, 1 On, 2 Custom.
rtx.dlssPreset = 1

# XeSS preset: 0 UltraPerf, 1 Performance, 2 Balanced, 3 Quality,
# 4 UltraQuality, 5 UltraQualityPlus, 6 NativeAA, 7 Custom.
rtx.xess.preset = 2

# Internal render scale used by temporal upscalers.
rtx.resolutionScale = 0.75

# Indirect lighting: 0 ImportanceSampled, 1 ReSTIR GI, 2 NeuralRadianceCache.
rtx.integrateIndirectMode = 2

# Keep manufacturer denoiser support available where the GPU/runtime supports it.
rtx.enableRayReconstruction = True

# Replacement asset toggles.
rtx.enableReplacementAssets = True
rtx.enableReplacementLights = True
rtx.enableReplacementMeshes = True
rtx.enableReplacementMaterials = True

# UI preferences.
rtx.defaultToAdvancedUI = False
rtx.restoreCursorPosition = True
rtx.gui.textureGridThumbnailScale = 1.0

# VSync: 0 Off, 1 On, 2 wait for the game's implicit swapchain setting.
rtx.enableVsync = 2
rtx.maxInstanceSubmissions = 512